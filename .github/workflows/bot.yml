name: Bot server (Cloudflare)

on:
  push:
    branches: [main]
    paths: ['bot/**', 'wrangler.toml', '.github/workflows/bot.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$BOT_TOKEN" ]; then
            echo "::notice::Секреты ещё не добавлены — пропускаю выкладку."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'yes'
        with:
          node-version: '20'

      - name: Database (create once)
        if: steps.check.outputs.ready == 'yes'
        run: |
          W="npx --yes wrangler@3.78.0"
          ID=$($W d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const d=a.find(x=>x.name==="eto-games");console.log(d?d.uuid:"")})')
          if [ -z "$ID" ]; then
            $W d1 create eto-games
            ID=$($W d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const d=a.find(x=>x.name==="eto-games");console.log(d?d.uuid:"")})')
          fi
          test -n "$ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml

      - name: Deploy worker
        if: steps.check.outputs.ready == 'yes'
        id: deploy
        run: |
          W="npx --yes wrangler@3.78.0"
          $W deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          TG_SECRET=$(printf '%s' "$BOT_TOKEN" | sha256sum | cut -c1-48)
          echo "::add-mask::$TG_SECRET"
          printf '%s' "$BOT_TOKEN" | $W secret put BOT_TOKEN
          printf '%s' "$TG_SECRET" | $W secret put TG_SECRET
          echo "TG_SECRET=$TG_SECRET" >> "$GITHUB_ENV"

      - name: Telegram webhook and commands
        if: steps.check.outputs.ready == 'yes'
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${URL}/tg" \
            --data-urlencode "secret_token=${TG_SECRET}" \
            --data-urlencode 'allowed_updates=["message"]' \
            --data-urlencode 'drop_pending_updates=true' > /dev/null
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/setMyCommands" -H 'Content-Type: application/json' -d '{"commands":[
            {"command":"games","description":"Все игры"},
            {"command":"top","description":"Рекорды игроков"},
            {"command":"bug","description":"Сообщить об ошибке"},
            {"command":"stop","description":"Не присылать новости"},
            {"command":"notify","description":"Присылать новые игры"}]}' > /dev/null
          DESC=$(printf 'Игротека «это_нормально» ☕\n\nЧайная змейка, тапок с балкона и сосед на ковре-самолёте. Собирай чашки, покупай скины и вызывай друзей побить твой рекорд.\n\n5 минут для себя — это нормально.')
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/setMyDescription" --data-urlencode "description=${DESC}" > /dev/null
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/setMyShortDescription" --data-urlencode "short_description=Мини-игры от это_нормально: змейка, тапок, сосед на ковре ☕" > /dev/null
          echo "Webhook, commands and description set."

      - name: Tell the games where the server is
        if: steps.check.outputs.ready == 'yes'
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          printf "// written by the bot workflow\nwindow.ETO_API = '%s';\n" "$URL" > common/config.js
          if ! git diff --quiet common/config.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add common/config.js
            git commit -m "Адрес сервера Игротеки"
            git push
          fi
